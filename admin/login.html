<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso CMS — Cine Tiza Festival</title>
  <link rel="shortcut icon" href="../images/Logo_CineTiza.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body style="background-color: #0B0B0E; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

  <div class="form-card" style="width: 100%; max-width: 420px; background-color: #14141C; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="../images/Logo_CineTiza.png" alt="Logo Cine Tiza" style="width: 64px; height: 64px; margin: 0 auto 1rem;">
      <h1 style="font-size: 1.6rem; color: #FFF; margin-bottom: 0.25rem;">PANEL DE CONTROL</h1>
      <span class="scene-tag">CINE TIZA CMS</span>
    </div>

    <div id="loginError" style="display: none; background: rgba(217, 54, 54, 0.15); border: 1px solid #D93636; color: #FF8080; padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1.5rem; text-align: center;"></div>

    <form id="adminLoginForm">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="loginUser" class="form-label">Usuario</label>
        <input type="text" id="loginUser" class="form-control" placeholder="admin" required autocomplete="username">
      </div>

      <div class="form-group" style="margin-bottom: 1.75rem;">
        <label for="loginPassword" class="form-label">Contraseña</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary w-100" style="padding: 1rem;">
        Ingresar al Panel →
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem;">
      <a href="../index.html" style="color: var(--text-muted); font-size: 0.85rem; transition: color 0.2s;">← Volver al sitio público</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
